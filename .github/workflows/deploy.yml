name: Docker Image CI

on:
  push:
    branches: [main]  # Se ejecutará en cualquier commit a la rama main
    paths:
      - 'Dockerfile'
      - 'composer.json'
      - 'package.json'
  pull_request:
    branches: [main]  # Se ejecutará para cualquier pull request a la rama main
    paths:
      - 'Dockerfile'
      - 'composer.json'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/jr_maker_crm:latest

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Add SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}  # Secreto SSH para el acceso al servidor
          known_hosts: |
            154.38.178.48 ssh-rsa 

      - name: Deploy to Production
        run: |
          ssh -o StrictHostKeyChecking=no root@154.38.178.48 <<EOF
            cd /home/jrmaker-dockge/htdocs/dockge.jrmaker.com.co/dockge-stacks/jr-maker-crm
            docker-compose -f compose.yaml down
            docker-compose -f compose.yaml pull
            docker-compose -f compose.yaml up -d
          EOF

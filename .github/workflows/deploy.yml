name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # actualizado a v4

      - name: Cache Docker layers
        uses: actions/cache@v4 # actualizado a v4 explícitamente
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Login to Docker Hub
        uses: docker/login-action@v3 # actualizado
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # actualizado

      - name: Build and push
        uses: docker/build-push-action@v6 # actualizado
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          push: true
          progress: auto
          tags: |
            jrmakercrmv2/jr_maker_crm_v2:latest
            jrmakercrmv2/jr_maker_crm_v2:${{ github.sha }}

      - name: Notify Portainer to redeploy
        run: |
          response=$(curl -s -w "\nHTTP Status: %{http_code}\n" -X POST "$PORTAINER_WEBHOOK_URL")
          echo "Response from Portainer:"
          echo "$response"
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
          
# Todas las acciones han sido actualizadas a las versiones más recientes (v3/v4) para evitar el error de acciones obsoletas
# actions/checkout@v4, actions/cache@v4, docker/login-action@v3, docker/setup-buildx-action@v3, docker/build-push-action@v6

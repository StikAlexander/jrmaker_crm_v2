name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/jr_maker_crm:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/jr_maker_crm:${{ github.sha }}

      - name: Trigger Portainer Webhook for stack update
        run: |
          curl -X POST https://portainer.jrmaker.com.co/api/stacks/webhooks/2abed5aa-c929-44be-8d95-c00b61cb8b16

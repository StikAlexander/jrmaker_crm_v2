services:
  app:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm
    ports:
      - 8001:8001
    environment:
      - APP_ENV=production
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=jr_maker_sas
      - DB_USERNAME=root
      - DB_PASSWORD=ae031323
    depends_on:
      - db
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001

  db:
    image: mysql:8.0
    container_name: DB_jr_maker_crm
    environment:
      MYSQL_ROOT_PASSWORD: ae031323
      MYSQL_DATABASE: jr_maker_sas
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ae031323
    ports:
      - 8081:80
    depends_on:
      - db

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  db_data: null

version: '2'
services:
  app:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm
    ports:
      - 8001:8001
    environment:
      - APP_ENV=${APP_ENV}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - /home/jr-crm-storage-no-borrar:/app/storage
    depends_on:
      - db
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001
    networks:
      nginxpm:
        ipv4_address: 172.18.0.6

  db:
    image: mysql:8.0
    container_name: DB_jr_maker_crm
    environment:
      MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      nginxpm:
        ipv4_address: 172.18.0.5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST=${DB_HOST}
      MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - 8081:80
    networks:
      nginxpm:
        ipv4_address: 172.18.0.7

volumes:
  db_data: null

networks:
  nginxpm:
    external:
      name: nginxpm
    ipam:
      config:
        - subnet: 172.18.0.0/16

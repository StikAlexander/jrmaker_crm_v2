version: '3.8'

services:
  app:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm
    ports:
      - 8001:8001
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      # Database config
      DB_CONNECTION: mysql
      DB_HOST: mysql_shared
      DB_PORT: 3306
      DB_DATABASE: jr_maker_sas
      DB_USERNAME: root
      DB_PASSWORD: ae031323
    depends_on:
      - mysql_shared
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001
    networks:
      - nginxpm

  worker:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm_worker
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      # Database config
      DB_CONNECTION: mysql
      DB_HOST: mysql_shared
      DB_PORT: 3306
      DB_DATABASE: jr_maker_sas
      DB_USERNAME: root
      DB_PASSWORD: ae031323
    depends_on:
      - mysql_shared
    command: php artisan queue:work --daemon --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped 
    networks:
      - nginxpm

networks:
  nginxpm:
    external: true

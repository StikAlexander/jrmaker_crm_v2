services:
  app:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm
    ports:
      - 8001:8001
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      # MercadoPago keys
      MERCADO_PAGO_PUBLIC_KEY: ${MERCADO_PAGO_PUBLIC_KEY}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN}
      MP_SECRET_KEY: ${MP_SECRET_KEY}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL}
      # Captcha keys
      NOCAPTCHA_SECRET: ${NOCAPTCHA_SECRET}
      NOCAPTCHA_SITEKEY: ${NOCAPTCHA_SITEKEY}
      # Logging
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Database config
      DB_CONNECTION: mysql
      DB_HOST: mysql_shared
      DB_PORT: 3306
      DB_DATABASE: jr_maker_sas
      DB_USERNAME: root
      DB_PASSWORD: ae031323
      # Redis config
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
      # Mail config
      MAIL_MAILER: ${MAIL_MAILER}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001
    networks:
      - nginxpm

  worker:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm_worker
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      # Database config
      DB_CONNECTION: mysql
      DB_HOST: mysql_shared
      DB_PORT: 3306
      DB_DATABASE: jr_maker_sas
      DB_USERNAME: root
      DB_PASSWORD: ae031323
      # Redis config
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: ${REDIS_PORT}
    command: php artisan queue:work --daemon --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    networks:
      - nginxpm

networks:
  nginxpm:
    external: true


services:
  app:
    image: your-dockerhub-username/jr_maker_crm:latest  # Usamos la imagen desde Docker Hub
    container_name: jr_maker_crm_app
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_DATABASE: jr_maker_sas
      DB_USERNAME: root
      DB_PASSWORD: ae031323
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: jr_maker_sas
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

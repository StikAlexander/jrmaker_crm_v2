version: '2'
services:
  app:
    image: sirnioh/jr_maker_crm:latest
    container_name: jr_maker_crm
    ports:
      - 8001:8001
    environment:
      - APP_ENV=${APP_ENV}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - /home/jr-crm-storage-no-borrar:/app/storage
    depends_on:
      - db
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8001
    networks:
      nginxpm:
        ipv4_address: 172.18.0.6
    mem_limit: 1.5g  # Limitar el uso de memoria a 1.5 GB para la aplicación CRM
    cpus: '1.5'      # Limitar el uso de CPU a 1.5 núcleos para la aplicación CRM

  db:
    image: mysql:8.0
    container_name: DB_jr_maker_crm
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      nginxpm:
        ipv4_address: 172.18.0.5
    mem_limit: 1g  # Limitar el uso de memoria a 1 GB para MySQL
    cpus: '1'      # Limitar el uso de CPU a 1 núcleo para MySQL

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: ${DB_HOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - 8081:80
    networks:
      nginxpm:
        ipv4_address: 172.18.0.7
    mem_limit: 256m  # Limitar el uso de memoria a 256 MB para phpMyAdmin
    cpus: '0.2'      # Limitar el uso de CPU a 0.2 núcleos para phpMyAdmin

volumes:
  db_data: null

networks:
  nginxpm:
    external:
      name: nginxpm
    ipam:
      config:
        - subnet: 172.18.0.0/16
